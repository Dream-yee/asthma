<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拿下來複製</title>
    <meta name="description" content="讓你方便檢視去年分科校系的分數並複製到自己的手機或電腦裡">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-container">
        <section class="card suggestion-section">
            <div class="list-container centered" id="suggestion-list">
            </div>
            <div class="search-bar-wrapper">
                <input type="text" id="main-search" placeholder="在這裡輸入關鍵字" />
            </div>
        </section>

        <section class="card selection-section">
            <div class="list-container centered" id="selected-list">
            </div>
            <button id="copy-btn" class="copy-button">
                <span>點我複製</span>
            </button>
        </section>
    </div>

        <div>
            <div class="island-trigger" onclick="toggleGsatIsland()">
                <span id="trigger-text" class="trigger-text">學測</span>
            </div>
            <div id="gsat-island" class="gsat-island">
                <div class="island-content">
                    <button id="mode-toggle-btn" class="mode-toggle-btn" onclick="cycleMode()">一般</button>
                    <div id="score-inputs-container" class="score-minimal-list">
                        </div>
                </div>
            </div>
        </div>
</body>
<script src="script.js"></script>

</html>
