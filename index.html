<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分科測驗校系標準及分數</title>
    <meta name="description" content="讓你更容易看大學校系以往分科的分數">
    <link rel="stylesheet" href="styles.css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1ERY9HXD50"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-1ERY9HXD50');
    </script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>分科測驗校系標準及分數</h1>
        </header>

        <div class="selector-group">
            <select id="university-select"></select>
            <select id="department-select"></select>
            <!-- <button id="search-icon-button" class="btn-search-icon" aria-label="開啟快速搜尋 (S)">
                輸入搜尋
            </button>
            <button id="gsat-button" class="btn-search-icon" aria-label="輸入學測分數 (G)">
                輸入學測分數
            </button> -->
        </div>

    <div id="results-display" class="results"></div>
        <div id="system-notes-container">
            <h3>ⓘ 你可能需要知道</h3>
            <div class="static-notes-box">
                <p>學測標準數A及數B同時出現代表其中一個達標即可。</p>
                <p>達標佔比是分數在 ⌈加權平均 x 科目數⌉ 以上的考生比例。</p>
                <p>右邊學測按鈕點下可輸入你的學測及術科分數 (學測為<b>60級分制</b>，術科為<b>百分制</b>)，會幫你算出你在當年分科平均要多少才能上</p>
                <p>考分會沒有與術科分數合併後的統計資料</p>
                <p><a href="./comparison" target="_blank">搜尋快速檢視</a> / <a href="./Ross" target="_blank">列清單複製</a> /  <a href="https://github.com/Dream-yee/asthma" target="_blank">GitHub</a></p>
                <p><a href="https://www.uac.edu.tw" target="_blank">考分會</a>資料連結: <a href="https://uac2.ncku.edu.tw/cross_search/" target="_blank">校系分則</a> / <a href="https://www.uac.edu.tw/uac114_note/" target="_blank">114</a> / <a href="https://www.uac.edu.tw/uac113_note/" target="_blank">113</a> / <a href="https://www.uac.edu.tw/uac112_note/" target="_blank">112</a></p>
            </div>
        </div>
    </div>

    <div id="spotlight-overlay">
        <div id="spotlight-search-box">
            <input type="text" id="spotlight-input" placeholder="輸入學校或科系的關鍵字，點擊任意處可跳開">
            <div id="spotlight-suggestions">
                </div>
        </div>
    </div>

    <div id="triggers">
        <div class="island-trigger" onclick="toggleGsatIsland()">
            <span id="trigger-text" class="trigger-text">學測</span>
        </div>
        <div id="gsat-island" class="gsat-island">
            <div class="island-content">
                <button id="mode-toggle-btn" class="mode-toggle-btn" onclick="cycleMode()">一般</button>
                <div id="score-inputs-container" class="score-minimal-list">
                </div>
            </div>
        </div>
        <div class="island-trigger spotlight-trigger" onclick="openSpotlight()">
            <span id="trigger-text" class="trigger-text">搜尋</span>
        </div>
    </div>

    <div id="left-hand-trigger" title="切換左撇子模式">
        <div class="trigger-indicator"></div>
    </div>

    <script src="script.js"></script> 
</body>
</html>
